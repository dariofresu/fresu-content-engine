name = "fresu-content-engine-auth"
main = "src/index.js"
compatibility_date = "2026-07-01"

kv_namespaces = [
  { binding = "TOKENS", id = "72d2b491af544b4ca3a11c01771e2a4f" }
]

[vars]
# public URL of this worker, set after first deploy, e.g.
# https://fresu-content-engine-auth.<account>.workers.dev
BASE_URL = "https://fresu-content-engine-auth.fresu-dario.workers.dev"
PLANNER_URL = "https://dariofresu.github.io/fresu-content-engine/"

# Secrets (set with: wrangler secret put <NAME>):
#   ENGINE_KEY            random string shared with GitHub Actions
#   LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   META_APP_ID / META_APP_SECRET
#   TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET
#   X_CLIENT_ID / X_CLIENT_SECRET
